<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>딥 다이브 크루</title>
<style>
:root{--bg:#f1f6fa;--fg:#10222f;--card:#fff;--mut:#5b7080;--acc:#1473b8;--bd:#cfdbe4;--ok:#1d9a5b;--no:#d23f3f}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0b1a24;--fg:#e6f0f6;--card:#14293a;--mut:#8da5b6;--acc:#4aa8e8;--bd:#25425a;--ok:#4cc58a;--no:#ef7272}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.45}
#app{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:6px 0 2px}h2{font-size:15px;margin:14px 0 6px;color:var(--mut)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
input{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:16px;margin:4px 0}
button.b{padding:11px 14px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:15px;font-weight:600;margin:4px 4px 4px 0}
button.b.s{background:transparent;color:var(--acc);border:1px solid var(--acc)}button:disabled{opacity:.4}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cards{display:flex;flex-wrap:wrap;gap:6px}
.card{width:46px;height:64px;border-radius:8px;border:2px solid transparent;color:#fff;font-size:20px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0}
.card small{font-size:13px;margin-top:3px}.card.sm{width:34px;height:46px;font-size:15px}
.card.can{border-color:var(--fg)}.card.dim{opacity:.45}.card.pick{outline:3px solid var(--acc)}
.mut{color:var(--mut);font-size:13px}.ok{color:var(--ok)}.no{color:var(--no)}
.trick{display:flex;gap:10px;flex-wrap:wrap;min-height:70px}.tc{text-align:center;font-size:12px}
.banner{padding:14px;border-radius:12px;text-align:center;font-weight:700;font-size:18px;margin:8px 0;color:#fff}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000c;color:#fff;padding:9px 14px;border-radius:20px;display:none}
</style>
</head>
<body>
<div id="app"><p class="mut">접속 중…</p></div>
<div id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ▼▼▼ Firebase 콘솔에서 복사한 설정값으로 교체하세요 ▼▼▼
const firebaseConfig={
  apiKey:"AIzaSyAu9YPqPVUqrhH8vhKthfZkaIUC3wIXBpM",
  authDomain:"deep-dive-crew.firebaseapp.com",
  projectId:"deep-dive-crew",
  appId:"1:711353915388:web:efca87cafaf27ab6070479"
};
// ▲▲▲ ▲▲▲

const CL={P:'#e0559f',B:'#2f86d6',G:'#6aaf2a',Y:'#d99a12',S:'#26323b'};
const SY={P:'□',B:'○',G:'▽',Y:'✕',S:'◉'};
let fdb,me=null,code=null,st=null,myCards=[],unsub=null,unsubH=null,sonarMode=false,name='';
try{name=localStorage.getItem('ddc-name')||''}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',1800)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const COLORCARDS=[];for(const c of 'PBGY')for(let v=1;v<=9;v++)COLORCARDS.push(c+v);
const DECK=[...COLORCARDS,'S1','S2','S3','S4'];
const gref=()=>doc(fdb,'games',code);
const href=()=>doc(fdb,'games',code,'hands',me);
function played(s){const p=new Set();Object.values(s.won||{}).forEach(a=>a.forEach(c=>p.add(c)));(s.trick||[]).forEach(t=>p.add(t.c));return p}
function myHand(){if(!st)return[];const p=played(st);return myCards.filter(c=>!p.has(c)).sort((a,b)=>DECK.indexOf(a)-DECK.indexOf(b))}
function taskState(s,t){for(const[k,a]of Object.entries(s.won||{}))if(a.includes(t.c))return +k===t.o?'done':'fail';return 'wait'}
function winner(tr){const l=tr[0].c[0];let b=null;for(const t of tr){const s=t.c[0],v=+t.c[1],r=s==='S'?100+v:(s===l?v:0);if(!b||r>b.r)b={r,s:t.s}}return b.s}
function enter(c){code=c;unsub&&unsub();unsubH&&unsubH();
 unsub=onSnapshot(gref(),sn=>{st=sn.exists()?sn.data():null;render()},()=>toast('연결 오류'));
 unsubH=onSnapshot(href(),sn=>{myCards=sn.exists()?sn.data().cards:[];render()})}
async function create(){if(!name.trim())return toast('이름을 입력하세요');const c=Math.random().toString(36).slice(2,6).toUpperCase();
 await setDoc(doc(fdb,'games',c),{host:me,phase:'lobby',players:[{id:me,name:name.trim()}],trick:[],won:{},sonar:{},result:'',tasks:[],left:[]});enter(c)}
async function join(){const c=($('#jc').value||'').trim().toUpperCase();if(!name.trim())return toast('이름을 입력하세요');if(!c)return toast('방 코드를 입력하세요');
 const sn=await getDoc(doc(fdb,'games',c));if(!sn.exists())return toast('방이 없어요');const s=sn.data();
 if(!s.players.some(p=>p.id===me)){if(s.phase!=='lobby')return toast('이미 시작된 방이에요');if(s.players.length>=5)return toast('방이 가득 찼어요');
  await updateDoc(doc(fdb,'games',c),{players:[...s.players,{id:me,name:name.trim()}]})}enter(c)}
async function start(){const n=st.players.length,d=shuffle(DECK),hands=Array.from({length:n},()=>[]);d.forEach((c,i)=>hands[i%n].push(c));
 const cs=shuffle(COLORCARDS).slice(0,n),ow=shuffle([...Array(n).keys()]);
 const cap=hands.findIndex(h=>h.includes('S4'));
 await Promise.all(st.players.map((p,i)=>setDoc(doc(fdb,'games',code,'hands',p.id),{cards:hands[i]})));
 await updateDoc(gref(),{phase:'play',trick:[],won:{},sonar:{},result:'',tasks:cs.map((c,i)=>({c,o:ow[i]})),left:hands.map(h=>h.length),lead:cap,turn:cap,captain:cap})}
async function play(c){const n=st.players.length,seat=st.players.findIndex(p=>p.id===me),h=myHand();
 if(st.trick.length){const ls=st.trick[0].c[0];if(c[0]!==ls&&h.some(x=>x[0]===ls))return toast('같은 종류를 내야 해요')}
 const trick=[...st.trick,{s:seat,c}],left=[...st.left];left[seat]--;let up;
 if(trick.length<n)up={trick,left,turn:(seat+1)%n};
 else{const w=winner(trick),won={...st.won};won[w]=[...(won[w]||[]),...trick.map(t=>t.c)];
  up={trick:[],won,left,lead:w,turn:w};const sts=st.tasks.map(t=>taskState({won},t));
  if(sts.includes('fail'))up.result='lose';else if(sts.every(x=>x==='done'))up.result='win';else if(left.every(x=>x===0))up.result='lose';
  if(up.result)up.phase='end'}
 await updateDoc(gref(),up)}
async function sonar(c){const seat=st.players.findIndex(p=>p.id===me),h=myHand().filter(x=>x[0]===c[0]);
 const pos=h.length===1?'유일':(c===h[h.length-1]?'최고':(c===h[0]?'최저':null));
 if(!pos||c[0]==='S')return toast('최고·최저·유일 카드만 가능해요');
 sonarMode=false;await updateDoc(gref(),{sonar:{...st.sonar,[seat]:{c,pos}}})}
const cardH=(c,cls='',attr='')=>`<button class="card ${cls}" style="background:${CL[c[0]]}" ${attr}>${c[1]}<small>${SY[c[0]]}</small></button>`;
const mini=c=>`<span class="card sm" style="background:${CL[c[0]]};display:inline-flex;vertical-align:middle">${c[1]}<small>${SY[c[0]]}</small></span>`;
function render(){const A=$('#app');
 if(!me){A.innerHTML='<h1>딥 다이브 크루</h1><div class="box">접속 중이거나 Firebase 설정이 비어 있어요.</div>';return}
 if(!code||!st){A.innerHTML=`<h1>🤿 딥 다이브 크루</h1><p class="mut">3~5명이 함께 임무를 완수하는 협력 카드 게임</p>
 <div class="box"><input id="nm" placeholder="이름" value="${esc(name)}" maxlength="12"><button class="b" data-a="create">방 만들기</button>
 <h2>친구 방 입장</h2><input id="jc" placeholder="방 코드 4자리" maxlength="4"><button class="b s" data-a="join">입장</button></div>
 <div class="box mut">규칙: 같은 종류 카드를 내야 하고(없으면 아무거나), 높은 숫자가 트릭을 따요. ◉ 잠수함은 최강 트럼프. 각자 받은 과제 카드를 직접 따내세요. 한 장이라도 남에게 뺏기면 실패! 소나는 한 번, 트릭 시작 전에만 쓸 수 있어요.</div>`;return}
 const n=st.players.length,seat=st.players.findIndex(p=>p.id===me),isHost=st.host===me;
 let h=`<h1>방 ${code}</h1>`;
 if(st.phase==='lobby'){h+=`<div class="box"><b>참가자 ${n}/5</b><br>${st.players.map(p=>esc(p.name)+(p.id===st.host?' 👑':'')).join(' · ')}</div>
 <p class="mut">친구에게 사이트 주소와 방 코드 <b>${code}</b>를 알려 주세요.</p>
 ${isHost?`<button class="b" data-a="start" ${n<3?'disabled':''}>게임 시작 (3인 이상)</button>`:'<p class="mut">방장이 시작하길 기다리는 중…</p>'}`;A.innerHTML=h;return}
 const mine=myHand(),myTurn=st.phase==='play'&&st.turn===seat;
 if(st.phase==='end')h+=`<div class="banner" style="background:${st.result==='win'?'var(--ok)':'var(--no)'}">${st.result==='win'?'🎉 임무 성공!':'💥 임무 실패'}</div>${isHost?'<button class="b" data-a="start">다시 하기</button>':'<p class="mut">방장이 다시 시작할 수 있어요.</p>'}`;
 h+=`<div class="mut">캡틴(◉4): ${esc(st.players[st.captain].name)} · 지금 차례: <b>${esc(st.players[st.turn].name)}</b></div>`;
 h+='<h2>과제</h2><div class="box">'+st.tasks.map(t=>{const s=taskState(st,t);return `<div>${mini(t.c)} ${esc(st.players[t.o].name)} → 이 카드 획득 <b class="${s==='done'?'ok':s==='fail'?'no':''}">${s==='done'?'✔ 완료':s==='fail'?'✖ 뺏김':''}</b></div>`}).join('')+'</div>';
 h+='<h2>크루</h2><div class="box">'+st.players.map((p,i)=>{const so=st.sonar[i];return `<div>${esc(p.name)}${i===seat?' (나)':''} · 딴 트릭 ${Math.floor(((st.won[i]||[]).length)/n)} · 남은 카드 ${st.left[i]}${so?` · 소나 ${mini(so.c)} <b>${so.pos}</b>`:''}</div>`}).join('')+'</div>';
 h+='<h2>현재 트릭</h2><div class="trick box">'+(st.trick.length?st.trick.map(t=>`<div class="tc">${cardH(t.c)}<br>${esc(st.players[t.s].name)}</div>`).join(''):'<span class="mut">비어 있음</span>')+'</div>';
 h+=`<h2>내 손패 ${myTurn?'<span class="ok">— 내 차례!</span>':''}</h2><div class="cards">`+mine.map(c=>{const ls=st.trick.length?st.trick[0].c[0]:null,ok=!ls||c[0]===ls||!mine.some(x=>x[0]===ls);
  return cardH(c,(sonarMode?'pick':(myTurn&&ok?'can':'dim')),`data-c="${c}"`)}).join('')+'</div>';
 if(st.phase==='play'){const used=!!st.sonar[seat];h+=`<div class="row"><button class="b s" data-a="sonar" ${used||st.trick.length?'disabled':''}>${sonarMode?'취소':'📡 소나 (1회)'}</button><span class="mut">${sonarMode?'공개할 최고·최저·유일 카드를 누르세요':'트릭 시작 전에만 사용 가능'}</span></div>`}
 A.innerHTML=h}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a],[data-c]');if(!b)return;
 try{const a=b.dataset.a;
  if(a==='create'||a==='join'){name=$('#nm').value;try{localStorage.setItem('ddc-name',name)}catch(x){}a==='create'?await create():await join()}
  else if(a==='start')await start();
  else if(a==='sonar'){sonarMode=!sonarMode;render()}
  else if(b.dataset.c){const c=b.dataset.c,seat=st.players.findIndex(p=>p.id===me);
   if(sonarMode)await sonar(c);else if(st.phase==='play'&&st.turn===seat)await play(c);else toast('내 차례가 아니에요')}
 }catch(err){console.error(err);toast('오류: '+(err.code||err.message))}});
try{const app=initializeApp(firebaseConfig);fdb=getFirestore(app);const cred=await signInAnonymously(getAuth(app));me=cred.user.uid}catch(e){console.error(e)}
render();
</script>
</body>
</html>
