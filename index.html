<!doctype html>
<html lang="ko" class="dark">
  <head>
<script>
(function(){
  function show(msg){
    try{
      var d=document.getElementById("ddc-err");
      if(!d){d=document.createElement("pre");d.id="ddc-err";
        d.style.cssText="position:fixed;left:0;right:0;top:0;z-index:99999;margin:0;padding:12px;background:#7f1d1d;color:#fff;font:12px/1.4 monospace;white-space:pre-wrap;max-height:60vh;overflow:auto";
        (document.body||document.documentElement).appendChild(d);}
      d.textContent+=msg+"\n";
    }catch(e){}
  }
  window.addEventListener("error",function(e){show("[오류] "+(e.message||"")+" ("+(e.filename||"").split("/").pop()+":"+(e.lineno||"")+")");});
  window.addEventListener("unhandledrejection",function(e){var r=e.reason;show("[오류] "+((r&&(r.code||r.message))||String(r)));});
  setTimeout(function(){var r=document.getElementById("root");if(!r||!r.children.length)show("[진단] 3초 뒤에도 게임 화면이 비어 있습니다.\n브라우저: "+navigator.userAgent);},3000);
})();
</script>

.ddc-combo-list {
  max-height: 11.5rem;
  overflow-y: auto;
  padding-right: 0.25rem;
}
/* === Physical Mission Task Card Styles (.tc-*) === */
.tc-pool-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(164px, 1fr));
  gap: 0.65rem;
  align-items: start;
}
.tc-compact-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(142px, 1fr));
  gap: 0.45rem;
  align-items: start;
}
.tc-wrapper {
  display: flex;
  flex-direction: column;
  gap: 0.32rem;
  width: 100%;
  max-width: 196px;
  margin: 0 auto;
}
.tc-wrapper-compact {
  max-width: 176px;
}
.tc-card {
  position: relative;
  border-radius: 0.72rem;
  padding: 0.28rem;
  background: linear-gradient(160deg, #f8fafc 0%, #edf2f7 100%);
  box-shadow: 0 6px 14px -4px rgba(2, 10, 20, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.75);
  transition: transform 0.16s ease, box-shadow 0.16s ease;
  color: #161f28;
  user-select: none;
}
.tc-card-compact {
  border-radius: 0.6rem;
  padding: 0.22rem;
}
.tc-card-done {
  background: linear-gradient(160deg, #dcfce7 0%, #bbf7d0 100%);
  box-shadow: 0 0 0 2px #10b981, 0 6px 16px -4px rgba(16, 185, 129, 0.45);
}
.tc-card-fail {
  background: linear-gradient(160deg, #fee2e2 0%, #fecaca 100%);
  box-shadow: 0 0 0 2px #ef4444, 0 6px 16px -4px rgba(239, 68, 68, 0.45);
}
.tc-inner {
  position: relative;
  overflow: hidden;
  border-radius: 0.5rem;
  background:
    radial-gradient(circle at 18% 15%, rgba(255, 255, 255, 0.58) 0%, transparent 48%),
    radial-gradient(circle at 82% 85%, rgba(125, 180, 214, 0.38) 0%, transparent 52%),
    linear-gradient(180deg, #ddeaf2 0%, #c8dfed 48%, #a7cfe5 100%);
  padding: 0.4rem 0.45rem 0.44rem;
  min-height: 11.4rem;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 0.3rem;
}
.tc-card-compact .tc-inner {
  border-radius: 0.42rem;
  padding: 0.32rem 0.36rem 0.36rem;
  min-height: 8.8rem;
  gap: 0.22rem;
}
.tc-card-done .tc-inner {
  background:
    radial-gradient(circle at 85% 15%, rgba(16, 185, 129, 0.22) 0%, transparent 50%),
    linear-gradient(180deg, #dcf5ea 0%, #c4ebd9 52%, #a6dec5 100%);
}
.tc-card-fail .tc-inner {
  background:
    radial-gradient(circle at 85% 15%, rgba(239, 68, 68, 0.2) 0%, transparent 50%),
    linear-gradient(180deg, #f9e0e2 0%, #f1c8cd 52%, #e6aeb5 100%);
}
.tc-meta-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.25rem;
  font-size: 0.6rem;
  line-height: 1;
}
.tc-diff-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.22rem;
  padding: 0.16rem 0.36rem;
  border-radius: 9999px;
  background: rgba(18, 42, 64, 0.12);
  color: #1b364d;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.tc-diff-sub {
  font-weight: 600;
  opacity: 0.72;
  font-size: 0.56rem;
}
.tc-status-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.15rem;
  padding: 0.15rem 0.36rem;
  border-radius: 9999px;
  font-size: 0.58rem;
  font-weight: 800;
  white-space: nowrap;
}
.tc-status-wait {
  background: rgba(15, 36, 56, 0.14);
  color: #21405c;
}
.tc-status-done {
  background: #059669;
  color: #ffffff;
}
.tc-status-fail {
  background: #dc2626;
  color: #ffffff;
}
.tc-headline {
  text-align: center;
  font-size: 0.78rem;
  font-weight: 900;
  line-height: 1.24;
  letter-spacing: -0.025em;
  color: #141c24;
  word-break: keep-all;
  white-space: pre-line;
}
.tc-card-compact .tc-headline {
  font-size: 0.7rem;
  line-height: 1.2;
}
.tc-subhead {
  text-align: center;
  font-size: 0.62rem;
  font-weight: 800;
  color: #233648;
  line-height: 1.2;
  word-break: keep-all;
}
.tc-card-compact .tc-subhead {
  font-size: 0.56rem;
}
.tc-stage {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.35rem;
  padding: 0.12rem 0.08rem;
  flex: 1 1 auto;
}
.tc-stage-col {
  flex-direction: column;
}
.tc-slot-wide {
  width: auto;
  padding: 0 0.38rem;
}
.tc-card-compact .tc-stage {
  padding: 0.06rem 0.04rem;
  gap: 0.25rem;
}
/* Suit mini cards (physical card inside task card) */
.tc-suit-card {
  position: relative;
  width: 3.1rem;
  height: 4.45rem;
  border-radius: 0.38rem;
  border: 2.5px solid #ffffff;
  box-shadow: 0 3px 8px rgba(8, 25, 42, 0.3);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  flex-shrink: 0;
}
.tc-card-compact .tc-suit-card {
  width: 2.45rem;
  height: 3.5rem;
  border-width: 2px;
  border-radius: 0.32rem;
}
.tc-suit-card-sm {
  width: 2.35rem;
  height: 3.35rem;
  border-width: 2px;
}
.tc-card-compact .tc-suit-card-sm {
  width: 1.9rem;
  height: 2.7rem;
  border-width: 1.5px;
}
.tc-suit-card-lg {
  width: 4.35rem;
  height: 6.2rem;
  border-width: 3px;
  border-radius: 0.48rem;
}
.tc-card-compact .tc-suit-card-lg {
  width: 3.45rem;
  height: 4.9rem;
